{% extends "base.html" %}
{% block title %}{{ code }} — {{ title }} | ATS Portal{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-6">
        <div class="ats-card p-5 text-center">
            <div class="display-4 fw-bold text-primary mb-2">{{ code }}</div>
            <h1 class="h4 fw-semibold mb-3">{{ title }}</h1>
            <p class="text-muted mb-4">{{ message }}</p>
            <div class="d-flex justify-content-center gap-2">
                <a href="{{ url_for('web.landing') }}" class="btn btn-primary">Return Home</a>
                <a href="{{ url_for('web.jobs_list_page') }}" class="btn btn-outline-secondary">Browse Jobs</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
