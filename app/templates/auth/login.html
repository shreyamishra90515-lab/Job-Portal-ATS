{% extends "base.html" %}
{% block title %}Sign In | ATS Portal{% endblock %}
{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="ats-card p-4 p-md-5">
            <h1 class="h4 fw-bold mb-1">Sign In to ATS Portal</h1>
            <p class="text-muted small mb-4">Authenticate securely with your registered email and password.</p>
            <form method="POST" action="{{ url_for('web.login_page') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                {% if next_url %}
                    <input type="hidden" name="next" value="{{ next_url }}">
                {% endif %}
                <div class="mb-3">
                    <label for="loginEmail" class="form-label fw-medium">Email Address</label>
                    <input type="email" class="form-control" id="loginEmail" name="email" value="{{ email }}" required autocomplete="email" placeholder="you@company.com">
                </div>
                <div class="mb-4">
                    <label for="loginPassword" class="form-label fw-medium">Password</label>
                    <input type="password" class="form-control" id="loginPassword" name="password" required autocomplete="current-password" placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>
            <hr class="my-4">
            <div class="text-center small text-muted">
                New to ATS Portal?
                <a href="{{ url_for('web.register_candidate_page') }}">Candidate Sign Up</a> ·
                <a href="{{ url_for('web.register_recruiter_page') }}">Recruiter Sign Up</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
